---
# Deploys redhat-rhaap-portal from the OpenShift Helm catalog.
# Requires secrets in self-service-portal namespace — see app-self-service-portal/README.md
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: self-service-portal
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "26"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://charts.openshift.io/
      chart: redhat-rhaap-portal
      # Pin after validating on your cluster: helm search repo openshift-helm-charts/redhat-rhaap-portal --versions
      targetRevision: "2.2.0"
      helm:
        releaseName: redhat-rhaap-portal
        valueFiles:
          - $values/app-self-service-portal/values.yaml
    - repoURL: https://github.com/lennysh/argocd-playground.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: self-service-portal
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 10m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.template.metadata.annotations["kubectl.kubernetes.io/restartedAt"]
    # Postgres secret is applied out-of-band; never let Helm rotate it on sync.
    - kind: Secret
      name: redhat-rhaap-portal-postgresql
      jsonPointers:
        - /data
...
