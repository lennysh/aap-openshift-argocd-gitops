---
# Copy to 02-secrets.yml (gitignored) and fill in values. See README.md.
# Apply before syncing the self-service-portal Helm Application:
#   oc apply -f 02-secrets.yml
apiVersion: v1
kind: Secret
metadata:
  name: secrets-rhaap-portal
  namespace: self-service-portal
  annotations:
    argocd.argoproj.io/sync-wave: "2"
type: Opaque
stringData:
  aap-host-url: https://CHANGE_ME-AAP-GATEWAY
  oauth-client-id: CHANGE_ME
  oauth-client-secret: CHANGE_ME
  aap-token: CHANGE_ME
---
# Embedded Postgres for the portal backend. Helm must NOT manage this secret
# (values.yaml sets postgresql.auth.existingSecret). Generate once and keep stable:
#   openssl rand -base64 12 | head -c 10
apiVersion: v1
kind: Secret
metadata:
  name: redhat-rhaap-portal-postgresql
  namespace: self-service-portal
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  postgres-password: CHANGE_ME_ADMIN
  password: CHANGE_ME_BN_BACKSTAGE
---
# Required for OCI plug-in delivery (pluginMode: oci in values.yaml).
# Prefer generating auth.json from a Registry Service Account:
#   https://access.redhat.com/RegistryAuthentication
# Secret name must match the Helm release name (redhat-rhaap-portal).
apiVersion: v1
kind: Secret
metadata:
  name: redhat-rhaap-portal-dynamic-plugins-registry-auth
  namespace: self-service-portal
  annotations:
    argocd.argoproj.io/sync-wave: "2"
type: Opaque
stringData:
  auth.json: |
    {
      "auths": {
        "registry.redhat.io": {
          "auth": "CHANGE_ME_BASE64_USER_COLON_PASSWORD"
        }
      }
    }
---
# Optional — only if you use private GitHub/GitLab repos for custom templates.
apiVersion: v1
kind: Secret
metadata:
  name: secrets-scm
  namespace: self-service-portal
  annotations:
    argocd.argoproj.io/sync-wave: "2"
type: Opaque
stringData:
  github-token: CHANGE_ME
  # gitlab-token: CHANGE_ME
