# Helm values for redhat-rhaap-portal (self-service automation portal).
# See README.md for required OpenShift secrets and AAP pre-install steps.
#
# Find chart/plugin versions:
#   helm search repo openshift-helm-charts/redhat-rhaap-portal --versions
#   https://access.redhat.com/page/ansible-automation-platform-self-service-automation-portal-lifecycle

redhat-developer-hub:
  global:
    # Required. Cluster router base only (no scheme), e.g. apps.cluster.example.com
    clusterRouterBase: apps.ocp001.lennysh.net
    # Recommended: OCI plug-in delivery from registry.redhat.io
    pluginMode: oci
    # Pin plug-in bundle version (align with lifecycle page and chart targetRevision)
    imageTagInfo: "2.2"
  upstream:
    backstage:
      appConfig:
        # Do not set catalog.providers.rhaap.production here — the chart renders
        # that key via catalog.providers.env and a duplicate key crashes the backend.
        permission:
          enabled: true
          rbac:
            admin:
              superUsers:
                - name: user:default/admin
                - name: group:default/aap-admins
              users:
                - name: user:default/admin
                - name: group:default/aap-admins
            pluginsWithPermission:
              - catalog
              - scaffolder
              - permission
        # Do not override extraEnvVars here — Helm replaces the whole list and
        # drops POSTGRESQL_ADMIN_PASSWORD, AAP/OAuth env, etc. (RHIDP-6082).
        #
        # Replace ephemeral per-pod plugin PVC with a stable named claim (see
        # 03-dynamic-plugins-pvc.yml). Full extraVolumes list required (RHIDP-6082).
        extraVolumes:
          - name: dynamic-plugins-root
            persistentVolumeClaim:
              claimName: redhat-rhaap-portal-dynamic-plugins-root
          - name: dynamic-plugins
            configMap:
              defaultMode: 420
              name: redhat-rhaap-portal-dynamic-plugins
              optional: true
          - name: dynamic-plugins-npmrc
            secret:
              defaultMode: 420
              optional: true
              secretName: redhat-rhaap-portal-dynamic-plugins-npmrc
          - name: dynamic-plugins-registry-auth
            secret:
              defaultMode: 416
              optional: true
              secretName: redhat-rhaap-portal-dynamic-plugins-registry-auth
          - name: npmcacache
            emptyDir: {}
          - name: extensions-catalog
            emptyDir: {}
          - name: temp
            emptyDir: {}
