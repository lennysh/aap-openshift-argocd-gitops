# Lab/playground only: supplementary TLS bypass for generic Node fetch(). RHAAP OAuth
# and catalog use undici with checkSSL from app-config (values.yaml) — see README.
# For production, replace with NODE_EXTRA_CA_CERTS + mounted router/ingress CA.
apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-backend-env
  namespace: self-service-portal
data:
  NODE_TLS_REJECT_UNAUTHORIZED: "0"
