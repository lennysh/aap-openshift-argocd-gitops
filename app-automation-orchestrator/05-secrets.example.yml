---
# Update CHANGE_ME values before syncing, or create equivalent secrets out-of-band.
# Required keys for postgres secrets: database, username, password
apiVersion: v1
kind: Secret
metadata:
  name: backend-db-secret
  namespace: automation-orchestrator
  annotations:
    argocd.argoproj.io/sync-wave: "5"
type: Opaque
stringData:
  database: CHANGE_ME
  username: CHANGE_ME
  password: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: temporal-db-secret
  namespace: automation-orchestrator
  annotations:
    argocd.argoproj.io/sync-wave: "5"
type: Opaque
stringData:
  database: CHANGE_ME
  username: CHANGE_ME
  password: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: initial-admin-password
  namespace: automation-orchestrator
  annotations:
    argocd.argoproj.io/sync-wave: "5"
type: Opaque
stringData:
  password: CHANGE_ME
